<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-mail enviado</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/email_enviado.css') }}">

</head>

<body class="tela_email_enviado">

    <main class="tela_email_enviado">

        <section class="card_email">

            <div class="logo">

                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo do Sistema de Amigurumis">

            </div>

            <div class="icone_sucesso" aria-hidden="true">
                ✓
            </div>

            <div class="conteudo_email">

                <h1>
                    E-mail enviado!
                </h1>

                <p class="texto_principal">

                    Se o e-mail informado estiver cadastrado,
                    enviamos um link para recuperação da sua senha.

                </p>

                <div class="aviso_email">

                    <p>

                        Verifique sua caixa de entrada e também
                        a pasta de <strong>spam</strong> ou
                        <strong>lixo eletrônico</strong>.

                    </p>

                </div>

                <p class="validade_link">

                    O link enviado terá validade de
                    <strong>15 minutos</strong>.

                </p>

                <a href="{{ url_for('auth.login') }}" class="btn_voltar">
                    Voltar para o login
                </a>

            </div>

        </section>

    </main>

    <footer class="rodape">

        <div class="rodape_conteudo">

            <span class="rodape_linha"></span>

            <p class="rodape_direitos">
                Sistema de Amigurumis
            </p>

        </div>

    </footer>
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>

</body>

</html>
